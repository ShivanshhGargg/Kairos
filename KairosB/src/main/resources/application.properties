spring.application.name=KairosB
# Load local development settings from the bundled .env file when it exists.
# Spring Boot does not read .env files automatically.
spring.config.import=optional:classpath:.env[.properties]

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ============================================================
# EMAIL
# ============================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# APPLICATION
# ============================================================
app.frontend-url=${FRONTEND_URL}
app.verification-token-expiration-hours=${VERIFICATION_TOKEN_EXPIRATION_HOURS}

# ============================================================
# GOOGLE OAUTH
# ============================================================
google.client-id=${GOOGLE_CLIENT_ID}

# ============================================================
# LOGGING
# ============================================================
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.com.shivansh.KairosB=${KAIROSB_LOG_LEVEL:INFO}
